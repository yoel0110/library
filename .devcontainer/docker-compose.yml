services:
  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: libreria-web
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=dblibreria
      - DB_USER=user
      - DB_PASSWORD=password
    networks:
      - libreria-network

  db:
    image: mysql:8.0
    container_name: libreria-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=dblibreria
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - ../.docker/mysql/02_contacto.sql:/docker-entrypoint-initdb.d/02_contacto.sql
      - "../Base Datos Libreria.sql:/docker-entrypoint-initdb.d/01_base_datos.sql"
    networks:
      - libreria-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: libreria-phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    networks:
      - libreria-network

networks:
  libreria-network:
    driver: bridge
